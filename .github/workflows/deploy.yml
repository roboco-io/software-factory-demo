name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  API_URL: https://sfd-api.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
jobs:
  api:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply sfd-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  web:
    needs: api
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
        env:
          VITE_API_BASE: ${{ env.API_URL }}/api
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/web/dist
          keep_files: true
  smoke:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: API health
        run: curl -fsS --retry 5 --retry-delay 5 "$API_URL/api/health"
      - name: API articles
        run: curl -fsS "$API_URL/api/articles?limit=1" | grep -q '"articlesCount"'
      - name: Web index (Pages 반영 대기 최대 5분)
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.WEB_URL }}" | grep -q 'Conduit' && exit 0
            sleep 10
          done
          exit 1
  factory-report:
    # 배포·스모크 결과를 해당 커밋의 팩토리 이슈에 반영한다. Cloudflare 시크릿과 environment는 쓰지 않는다.
    # 연속 병합으로 대기 중이던 deploy run이 취소되면 그 커밋의 이슈는 merged에 남는다(README 런북 참고).
    needs: [api, web, smoke]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: 팩토리 이슈에 배포 결과 반영
        run: |
          if [ "$SMOKE" = "success" ]; then pnpm -s factory deployed --sha "$GITHUB_SHA"; else pnpm -s factory deploy-failed --sha "$GITHUB_SHA"; fi
        env:
          FACTORY_TOKEN: ${{ steps.app.outputs.token }}
          SMOKE: ${{ needs.smoke.result }}
