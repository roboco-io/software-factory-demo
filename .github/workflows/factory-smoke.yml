name: factory-smoke
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      api_base:
        description: 검증용 실패 주입에만 쓴다. 프로덕션 API(https://sfd-api.<WORKERS_SUBDOMAIN>.workers.dev/api) 자신이나 그 하위 경로만 허용한다. 비우면 프로덕션 API를 검사한다.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: factory-smoke
  cancel-in-progress: false
jobs:
  target:
    # 실패 주입용 api_base는 프로덕션 API 호스트 아래 경로만 받는다. 다른 호스트를 검사하거나 스모크 이슈에 임의 URL을 싣지 못하게 한다.
    # 이 job이 실패하면 report도 실행되지 않는다(잘못된 입력을 스모크 실패로 기록하지 않는다).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PROD_API: https://sfd-api.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev/api
    steps:
      - name: api_base가 프로덕션 API 밖이면 거부
        if: ${{ inputs.api_base != '' && inputs.api_base != env.PROD_API && !startsWith(inputs.api_base, format('{0}/', env.PROD_API)) }}
        run: exit 1
  checks:
    # 프로덕션에 읽기 요청만 보낸다(spec 7.1.3). 시크릿과 GitHub App 토큰을 받지 않는다.
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      API_BASE: ${{ inputs.api_base || format('https://sfd-api.{0}.workers.dev/api', vars.WORKERS_SUBDOMAIN) }}
      E2E_BASE_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: gacts/install-hurl@v1
      - name: API 읽기 전용 스모크(Hurl)
        run: hurl --test --variable "api=$API_BASE" tests/smoke/readonly.hurl
      # Hurl이 실패해도 웹 스모크까지 실행해 실패 범위를 한 run에서 보이게 한다.
      - if: ${{ !cancelled() }}
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: 웹 읽기 전용 스모크(Playwright)
        if: ${{ !cancelled() }}
        run: pnpm --filter web exec playwright test -c e2e-smoke/playwright.config.ts
  report:
    needs: [target, checks]
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      # F6: checks가 취소·시간 초과로 끝나도 실패로 넘긴다. 스모크 실패가 이슈 없이 사라지지 않게 한다.
      - run: pnpm -s factory smoke-report --result "$RESULT"
        env:
          FACTORY_TOKEN: ${{ steps.app.outputs.token }}
          FACTORY_BOT_USER_ID: ${{ vars.FACTORY_BOT_USER_ID }}
          RESULT: ${{ needs.checks.result == 'success' && 'success' || 'failure' }}
          SMOKE_API_BASE: ${{ inputs.api_base }}
